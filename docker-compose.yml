# =============================================================================
# Nofida — self-contained, version-pinned Penpot stack (branded, single-origin)
# =============================================================================
# One file for both local dev and production. The ONLY difference between them
# is PENPOT_PUBLIC_URI (and TLS, which Caddy terminates in front on the server):
#
#   Local : docker compose up -d --build            → http://localhost:9001
#   Prod  : PENPOT_PUBLIC_URI=https://engine.sys.bachopus.com docker compose up -d --build
#           (Caddy reverse-proxies 443 → this frontend on :9001 — see
#            scripts/setup-cloud-core.sh)
#
# There is NO iframe and NO Vercel layer: the branded Penpot frontend is the
# whole app and is served on one origin, so session cookies are first-party.
#
# Service names (penpot-backend, penpot-exporter, penpot-postgres,
# penpot-valkey) are FIXED — the frontend image's nginx resolves them by name.
# =============================================================================

x-penpot-version: &penpot-version "2.16.0"

# Flags shared by frontend + backend so the login/register UI matches backend
# behaviour. `enable-plugins` powers the Nofida AI companion plugin.
# `enable-mcp` + `enable-access-tokens` expose the native MCP Server section in
# Account → Integrations and the stream URL / key flow documented by Penpot.
# `disable-onboarding` removes the onboarding survey modal from self-hosted UX.
# `disable-secure-session-cookies` keeps local http working; harmless behind
# Caddy's HTTPS in prod. Drop it in prod if you want the Secure cookie flag.
x-penpot-flags: &penpot-flags >-
  enable-registration
  enable-login-with-password
  disable-email-verification
  disable-secure-session-cookies
  enable-plugins
  enable-access-tokens
  enable-mcp
  disable-onboarding

services:
  penpot-frontend:
    # Branded override image (Penpot frontend + Nofida CSS/logo + AI Core JS).
    build:
      context: ./branding
      args:
        PENPOT_VERSION: *penpot-version
    image: nofida/frontend:2.16.0
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets:ro
      - ${NOFIDA_LIBRARY_STORE_ROOT:-./branding/libraries}:/var/www/app/nofida/libraries:ro
      - ${NOFIDA_FONT_STORE_ROOT:-./font-store}:/opt/nofida-core/font-store:ro
      - ${NOFIDA_FONT_STORE_ROOT:-./font-store}:/var/www/app/nofida/font-store:ro
      - ${NOFIDA_MEDIA_STORE_ROOT:-./branding/media-store}:/opt/nofida-core/media-store:ro
      - ${NOFIDA_MEDIA_STORE_ROOT:-./branding/media-store}:/var/www/app/nofida/media-store:ro
    ports:
      # Bind to loopback only. Docker's published ports bypass ufw, so exposing
      # 0.0.0.0 would make Penpot publicly reachable on :9001 around the
      # firewall. localhost works for local dev AND for the server's Caddy,
      # which reverse-proxies 443 → 127.0.0.1:9001.
      - "127.0.0.1:9001:8080"
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
      - nofida-hub-adapter
    environment:
      PENPOT_FLAGS: *penpot-flags
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:9001}
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600
    networks: [nofida-network]

  nofida-hub-adapter:
    build:
      context: ./services/nofida-hub-adapter
    image: nofida/hub-adapter:018b
    restart: always
    volumes:
      - ${NOFIDA_LIBRARY_STORE_ROOT:-./branding/libraries}:/srv/library-store:ro
      - ${NOFIDA_FONT_STORE_ROOT:-./font-store}:/srv/font-store:ro
      - ${NOFIDA_MEDIA_STORE_ROOT:-./branding/media-store}:/srv/media-store:ro
      - nofida_ai_settings:/var/lib/nofida-hub-adapter
    environment:
      PENPOT_BASE_URL: http://penpot-frontend:8080
      NOFIDA_LIBRARY_STORE_ROOT: /srv/library-store
      NOFIDA_FONT_STORE_ROOT: /srv/font-store
      NOFIDA_MEDIA_STORE_ROOT: /srv/media-store
      NOFIDA_HUB_IMPORT_CHUNK_SIZE: 26214400
      NOFIDA_HUB_MAX_IMPORT_BYTES: 367001600
      NOFIDA_AI_SETTINGS_PATH: /var/lib/nofida-hub-adapter/secrets/ai-settings.json
      # ── NOFIDA AI ─────────────────────────────────────────────────────────
      # 016B migrates env-only AI config into server-side settings storage.
      # These env vars are still read once as a migration seed if no settings
      # file exists yet; afterwards, live configuration is managed in-app.
      NOFIDA_AI_PROVIDER: ${NOFIDA_AI_PROVIDER:-}
      NOFIDA_AI_MODEL: ${NOFIDA_AI_MODEL:-}
      NOFIDA_AI_API_KEY: ${NOFIDA_AI_API_KEY:-}
      NOFIDA_AI_BASE_URL: ${NOFIDA_AI_BASE_URL:-}
      NOFIDA_AI_MAX_TOKENS: ${NOFIDA_AI_MAX_TOKENS:-1024}
    networks: [nofida-network]

  penpot-backend:
    image: penpotapp/backend:2.16.0
    restart: always
    depends_on:
      - penpot-postgres
      - penpot-valkey
    volumes:
      - penpot_assets:/opt/data/assets
    environment:
      PENPOT_FLAGS: *penpot-flags
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:9001}

      # Signs session tokens. MUST be set to a long random value in prod.
      # Generate once: `openssl rand -hex 32` and put it in a .env file.
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:-CHANGE-ME-please-set-a-32-byte-random-secret}

      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot
      PENPOT_REDIS_URI: redis://penpot-valkey/0

      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
    networks: [nofida-network]

  penpot-exporter:
    image: penpotapp/exporter:2.16.0
    restart: always
    depends_on:
      - penpot-valkey
    environment:
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:-CHANGE-ME-please-set-a-32-byte-random-secret}
    networks: [nofida-network]

  penpot-mcp:
    image: penpotapp/mcp:2.16.0
    restart: always
    networks: [nofida-network]

  penpot-postgres:
    image: postgres:15
    restart: always
    stop_signal: SIGINT
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: penpot
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks: [nofida-network]

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: always
    volumes:
      - penpot_valkey_data:/data
    networks: [nofida-network]

volumes:
  penpot_postgres_v15:
  penpot_valkey_data:
  penpot_assets:
  nofida_ai_settings:

networks:
  nofida-network:
    driver: bridge
