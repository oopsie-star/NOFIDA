<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NOFIDA icon</title>
  <desc id="desc">High-contrast NOFIDA product icon for dark UI surfaces.</desc>
  <defs>
    <linearGradient id="tile" x1="74" y1="62" x2="438" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#265487"/>
