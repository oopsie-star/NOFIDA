<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NOFIDA logo</title>
  <desc id="desc">High-contrast NOFIDA logo for dark product surfaces.</desc>
  <defs>
    <linearGradient id="tile" x1="68" y1="44" x2="316" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#224A78"/>
      <stop offset="0.52" stop-color="#132A4D"/>
      <stop offset="1" stop-color="#0A152B"/>
    </linearGradient>
    <linearGradient id="tileStroke" x1="82" y1="56" x2="302" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5E4FF"/>
      <stop offset="0.45" stop-color="#5FA8FF"/>
      <stop offset="1" stop-color="#163764"/>
    </linearGradient>
    <linearGradient id="emerald" x1="118" y1="86" x2="270" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5FF5F"/>
      <stop offset="0.42" stop-color="#81F7B9"/>
      <stop offset="1" stop-color="#27D58A"/>
    </linearGradient>
    <linearGradient id="emeraldDark" x1="120" y1="152" x2="224" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66F3B3"/>
      <stop offset="1" stop-color="#0D9F6B"/>
    </linearGradient>
    <linearGradient id="word" x1="366" y1="84" x2="1260" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.52" stop-color="#D7ECFF"/>
      <stop offset="1" stop-color="#8AC7FF"/>
    </linearGradient>
    <filter id="tileShadow" x="30" y="28" width="330" height="324" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020A13" flood-opacity="0.34"/>
    </filter>
    <filter id="wordShadow" x="350" y="54" width="970" height="240" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020A13" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="58" y="48" width="274" height="274" rx="72" fill="url(#tile)"/>
    <rect x="68" y="58" width="254" height="254" rx="62" stroke="url(#tileStroke)" stroke-width="14" opacity="0.94"/>
  </g>

  <g>
    <path d="M118 236V126.4C118 119.6 126.5 116.2 131.3 121.2L178 171.2V278H144C129.6 278 118 266.4 118 252V236Z" fill="url(#emeraldDark)"/>
    <path d="M110 108H160C171.5 108 182.5 112.7 190.5 121L274.6 208.8C286.8 221.5 297.8 235.5 307.3 250.5L317.7 266.9C322.8 274.9 317 285 307.6 285H270.9C248.8 285 227.7 276 212.4 260.1L110 108Z" fill="url(#emerald)"/>
    <path d="M238 108H288V237.5C288 244.4 279.3 247.6 274.7 242.4L238 200.9V108Z" fill="url(#emerald)"/>
    <path d="M120 149L221 260" stroke="#0B152B" stroke-opacity="0.24" stroke-width="12"/>
  </g>

  <g filter="url(#wordShadow)">
    <text x="382" y="232" fill="url(#word)" font-family="Montserrat, Inter, Avenir Next, Arial Black, Arial, sans-serif" font-size="150" font-weight="900" letter-spacing="22">NOFIDA</text>
