<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spark Sticker Pack</title>
  <desc id="desc">Placeholder sticker pack for NOFIDA media bank.</desc>
  <rect width="1600" height="900" rx="48" fill="#0f172a"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(360 310) rotate(-10)">
      <rect x="-170" y="-80" width="340" height="160" rx="36" fill="#ef4444"/>
      <text y="20" font-size="54" fill="#fff7ed">Launch</text>
    </g>
    <g transform="translate(830 480) rotate(8)">
      <rect x="-180" y="-90" width="360" height="180" rx="40" fill="#facc15"/>
      <text y="22" font-size="56" fill="#0f172a">Beta</text>
    </g>
    <g transform="translate(1220 300) rotate(-6)">
      <rect x="-180" y="-88" width="360" height="176" rx="40" fill="#22c55e"/>
      <text y="18" font-size="52" fill="#08111f">Approved</text>
    </g>
  </g>
  <text x="120" y="150" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">Spark Stickers</text>
</svg>
