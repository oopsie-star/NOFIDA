# config.js is dynamically generated by the entrypoint from PENPOT_PUBLIC_URI.
# Must not be cached — a stale version with localhost:9001 breaks the whole app.
location = /js/config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
}

location /api/nofida/hub/ {
    proxy_pass http://nofida-hub-adapter:3101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# NOFIDA AI endpoint — proxied to the same hub-adapter service, separate prefix.
# Session cookie is forwarded so the adapter can validate auth for paid providers.
# proxy_read_timeout MUST stay comfortably above the worst case the app itself
# can take: engine.timeoutMs (settings-configurable up to 120s) x (1 + retries)
# — e.g. 90s timeout x 2 attempts = 180s. Below that, nginx cuts the connection
# and returns its own 504 HTML page before our retry/fallback logic finishes,
# which the frontend then fails to parse as JSON ("Unexpected token '<'") —
# a confusing error that looks like a model/parsing bug but is really just
# this proxy timeout being lower than the budget it's supposed to allow.
location /api/nofida/ai/ {
    proxy_pass http://nofida-hub-adapter:3101/ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /nofida/libraries/catalog.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# The generic `location ~* ^/nofida/` catch-all further below never wins for
# non-static-asset extensions (.json, .html) — Penpot's own nested location
# inside `location /` (app/nginx.conf) intercepts those first and 301s to
# /404. Exact-match `location =` rules always take priority over any regex
# location, so — same pattern as the catalog.json rules above — the Nofida AI
# Penpot plugin's manifest and UI need their own exact entries to be reachable
# at all (Penpot's Plugin Manager fetches manifest.json by URL; without this
# it 404s and the plugin can never be installed).
location = /nofida/ai-core/plugin/manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /nofida/ai-core/plugin/ui.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Type "text/html; charset=utf-8" always;
}

location = /nofida/fonts/catalog.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /nofida/font-store/catalog.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /nofida/libraries/inventory.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /nofida/media-store/catalog.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ~* ^/nofida/libraries/(logs|quarantine)/ {
    return 404;
}

location ~* ^/nofida/font-store/logs/ {
    return 404;
}

location ~* ^/nofida/libraries/files/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
}

location ~* ^/nofida/font-store/(files|licenses)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
}

location ~* ^/nofida/media-store/(files|thumbnails|licenses)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
}

location ^~ /nofida/help/ {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Type "text/html; charset=utf-8" always;
}

location ~* ^/nofida/ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
