location = /nofida/libraries/catalog.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /nofida/libraries/inventory.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ~* ^/nofida/libraries/(logs|quarantine)/ {
    return 404;
}

location ~* ^/nofida/libraries/files/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
}

location ~* ^/nofida/ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
