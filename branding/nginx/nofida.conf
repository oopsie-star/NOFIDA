# config.js is dynamically generated by the entrypoint from PENPOT_PUBLIC_URI.
# Must not be cached — a stale version with localhost:9001 breaks the whole app.
location = /js/config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
}

location /api/nofida/hub/ {
    proxy_pass http://nofida-hub-adapter:3101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# NOFIDA AI endpoint — proxied to the same hub-adapter service, separate prefix.
# Session cookie is forwarded so the adapter can validate auth for paid providers.
location /api/nofida/ai/ {
    proxy_pass http://nofida-hub-adapter:3101/ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location = /nofida/libraries/catalog.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /nofida/libraries/inventory.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ~* ^/nofida/libraries/(logs|quarantine)/ {
    return 404;
}

location ~* ^/nofida/libraries/files/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
}

location ~* ^/nofida/ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
